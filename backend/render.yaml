# Render.com blueprint – deploy the API with "New > Blueprint" pointing at this repo.
services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set to https://<your-frontend>.vercel.app in the dashboard
      - key: GEOCODER_USER_AGENT
        sync: false   # e.g. "eld-trip-planner/1.0 (you@example.com)"
      - key: MAX_AVERAGE_SPEED_MPH
        value: "60"
